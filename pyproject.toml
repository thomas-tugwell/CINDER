[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cinder"
version = "0.1.0"
description = "Ensemble-aware protein binder sequence design with generative conformational models and differentiable molecular energetics."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["torch>=2.2", "numpy>=1.25", "pyyaml>=6.0"]

[project.optional-dependencies]
tmol = ["tmol>=0.1.64"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy", "types-PyYAML", "matplotlib>=3.8", "pre-commit", "vulture"]

[project.scripts]
cinder = "cinder.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cinder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not tmol and not gpu and not slow'"
markers = [
  "tmol: requires the optional TMol dependency",
  "gpu: requires a CUDA/MPS accelerator",
  "slow: slow statistical / training tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
python_version = "3.11"
files = ["src/cinder"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.vulture]
paths = ["src", "scripts", "tests", "examples"]
min_confidence = 60
ignore_names = ["forward"]  # nn.Module.forward is called implicitly
